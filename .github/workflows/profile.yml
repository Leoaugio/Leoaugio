name: Update Profile

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
update-profile:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v6

  - name: Generate GitHub Stats
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=false&theme=transparent&hide_border=true&rank_icon=github
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate Top Languages
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=transparent&hide_border=true
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate Snake
    uses: Platane/snk/svg-only@v3
    with:
      github_user_name: ${{ github.repository_owner }}
      outputs: |
        profile/github-snake.svg?palette=github-light
        profile/github-snake-dark.svg?palette=github-dark

  - name: Commit generated files
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add profile/

      git diff --cached --quiet || git commit -m "chore: update profile"

      git push
```
